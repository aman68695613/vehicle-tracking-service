services:
  postgres:
    image: postgres:16
    container_name: vehicle-tracking-db
    environment:
      POSTGRES_DB: vehicle_tracking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell or a .env file}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vehicle_tracking"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
