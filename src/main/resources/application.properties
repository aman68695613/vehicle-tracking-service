spring.application.name=vehicle-tracking-service

# PostgreSQL configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/vehicle_tracking
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Tracking properties
tracking.future-limit-ms=30000
tracking.stale-limit-ms=300000
tracking.gap-threshold-ms=120000
tracking.min-speed-ms=2.0
tracking.traffic-factor=1.2
tracking.ema-alpha=0.3
tracking.eta-publish-threshold-seconds=15
tracking.striped-lock-count=64
