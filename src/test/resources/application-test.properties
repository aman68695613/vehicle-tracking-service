spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Tracking properties
tracking.future-limit-ms=30000
tracking.stale-limit-ms=300000
tracking.gap-threshold-ms=120000
tracking.min-speed-ms=2.0
tracking.traffic-factor=1.2
tracking.ema-alpha=0.3
tracking.eta-publish-threshold-seconds=15
tracking.striped-lock-count=64

